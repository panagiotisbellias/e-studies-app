# .github/ISSUE_TEMPLATE/bug_report.yml

name: Bug Report
description: Report a problem or unexpected behavior
labels: [bug]
body:

  - type: textarea
    attributes:
      label: Description
      description: A clear and concise description of the bug
      validations:
      required: true

  - type: textarea
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Go to...
        2. Click on...
        3. See error
      validations:
      required: true

  - type: textarea
    attributes:
      label: Expected Behavior

  - type: textarea
    attributes:
      label: Environment
      placeholder: |
        - OS:
        - Java version:
        - App version:
