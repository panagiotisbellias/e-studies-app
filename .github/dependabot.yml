## .github/dependabot.yml

version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    reviewers:
      - panagiotisbellias
    commit-message:
      prefix: "deps"
    groups:
      maven-non-major:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    reviewers:
      - panagiotisbellias
    commit-message:
      prefix: "ci"
    groups:
      github-actions-updates:
        patterns:
          - "*"
