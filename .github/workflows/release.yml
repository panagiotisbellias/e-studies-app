name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.2.0)'
        required: true
        type: string
  push:
    tags:
      - 'v*'           # trigger on semantic version tags like v2.0.0

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and verify
        run: mvn clean verify --batch-mode

      - name: Generate SBOM
        run: mvn org.cyclonedx:cyclonedx-maven-plugin:makeAggregateBom --batch-mode

      - name: Verify SBOM files
        run: |
          ls -la target/
          test -s target/bom.xml
          test -s target/bom.json

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$RELEASE_VERSION" \
            --verify-tag \
            --title "$RELEASE_VERSION" \
            --generate-notes \
            target/*.jar \
            target/bom.xml \
            target/bom.json \
